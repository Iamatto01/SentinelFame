<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Sapphire Blue Diamond Gradients -->
    <linearGradient id="blueDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="diamondFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadow & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Crown Base Shadow & Body -->
  <g filter="url(#glow)">
    <!-- Royal Crown Cushion (Velvet Crimson Backing) -->
    <path d="M 12 46 Q 32 40 52 46 L 50 32 Q 32 26 14 32 Z" fill="#991B1B" opacity="0.85" />

    <!-- Main Golden Crown Structure (5 Peaks) -->
    <path d="M 8 46 
             L 11 26 
             L 21 34 
             L 32 14 
             L 43 34 
             L 53 26 
             L 56 46 
             Q 32 50 8 46 Z" 
          fill="url(#gold)" 
          stroke="#78350F" 
          stroke-width="1.2" 
          stroke-linejoin="round" />

    <!-- Crown Highlights / Inner Ridge -->
    <path d="M 14 44 
             L 15 29 
             L 23 35 
             L 32 19 
             L 41 35 
             L 49 29 
             L 50 44 
             Q 32 47 14 44 Z" 
          fill="none" 
          stroke="url(#goldLight)" 
          stroke-width="1" 
          opacity="0.75" />

    <!-- Crown Base Band -->
    <rect x="8" y="44" width="48" height="8" rx="2" fill="url(#gold)" stroke="#78350F" stroke-width="1" />
    <!-- Crown Base Inner Plate -->
    <rect x="10" y="45.5" width="44" height="5" rx="1" fill="#78350F" opacity="0.3" />

    <!-- Jewels along the headband -->
    <circle cx="16" cy="48" r="2" fill="url(#blueDiamond)" stroke="#0369A1" stroke-width="0.5" />
    <circle cx="24" cy="48" r="1.6" fill="#EF4444" stroke="#991B1B" stroke-width="0.5" />
    <polygon points="32,45.5 34.5,48 32,50.5 29.5,48" fill="url(#blueDiamond)" stroke="#0369A1" stroke-width="0.5" />
    <circle cx="40" cy="48" r="1.6" fill="#EF4444" stroke="#991B1B" stroke-width="0.5" />
    <circle cx="48" cy="48" r="2" fill="url(#blueDiamond)" stroke="#0369A1" stroke-width="0.5" />

    <!-- 5 Blue Diamonds on the Peak Tips -->
    <!-- Peak 1 (Leftmost Tip) -->
    <g transform="translate(11, 25)">
      <polygon points="0,-4.5 3.5,-1 0,3.5 -3.5,-1" fill="url(#blueDiamond)" stroke="#0284C7" stroke-width="0.6" />
      <polygon points="0,-4.5 2,-1 0,0 -2,-1" fill="url(#diamondFacet)" />
    </g>

    <!-- Peak 2 (Mid-Left Tip) -->
    <g transform="translate(21, 33)">
      <polygon points="0,-3.5 2.5,-0.8 0,2.5 -2.5,-0.8" fill="url(#blueDiamond)" stroke="#0284C7" stroke-width="0.5" />
      <polygon points="0,-3.5 1.5,-0.8 0,0 -1.5,-0.8" fill="url(#diamondFacet)" />
    </g>

    <!-- Peak 3 (Center High Tip - Largest Sapphire Diamond) -->
    <g transform="translate(32, 13)">
      <polygon points="0,-6 4.8,-1.2 0,5 -4.8,-1.2" fill="url(#blueDiamond)" stroke="#0369A1" stroke-width="0.8" />
      <polygon points="0,-6 3,-1.2 0,0.5 -3,-1.2" fill="url(#diamondFacet)" />
      <!-- Diamond Sparkle Accent -->
      <circle cx="-1" cy="-2.5" r="0.8" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Peak 4 (Mid-Right Tip) -->
    <g transform="translate(43, 33)">
      <polygon points="0,-3.5 2.5,-0.8 0,2.5 -2.5,-0.8" fill="url(#blueDiamond)" stroke="#0284C7" stroke-width="0.5" />
      <polygon points="0,-3.5 1.5,-0.8 0,0 -1.5,-0.8" fill="url(#diamondFacet)" />
    </g>

    <!-- Peak 5 (Rightmost Tip) -->
    <g transform="translate(53, 25)">
      <polygon points="0,-4.5 3.5,-1 0,3.5 -3.5,-1" fill="url(#blueDiamond)" stroke="#0284C7" stroke-width="0.6" />
      <polygon points="0,-4.5 2,-1 0,0 -2,-1" fill="url(#diamondFacet)" />
    </g>
  </g>
</svg>
